<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — V-ACCESS</title>
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="auth-shell">
  <main class="auth-card">
    <span class="auth-card__mark">V·ACCESS</span>

    <div id="request-step">
      <h1>Reset your password</h1>
      <p class="text-muted">Enter your VIT email and we'll send a verification code.</p>
      <div id="request-alert-region" role="alert"></div>
      <form id="request-form" novalidate>
        <div class="field" id="field-email">
          <label for="email">VIT email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="yourname2026@vitstudent.ac.in" required />
          <div class="field-error" hidden></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="request-submit-btn">
          <span class="btn-label">Send reset code</span>
        </button>
      </form>
    </div>

    <div id="reset-step" hidden>
      <h1>Enter your new password</h1>
      <p class="text-muted">Enter the code sent to <strong id="reset-email-display"></strong> and choose a new password.</p>
      <div id="reset-alert-region" role="alert"></div>
      <form id="reset-form" novalidate>
        <div class="field otp-input" id="field-otp">
          <label for="otp">Verification code</label>
          <input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
          <div class="field-error" hidden></div>
        </div>
        <div class="field" id="field-newPassword">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required />
          <div class="hint">At least 8 characters, with a letter and a number.</div>
          <div class="field-error" hidden></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit-btn">
          <span class="btn-label">Reset password</span>
        </button>
      </form>
    </div>

    <div class="auth-card__foot">
      <a href="/index.html">Back to log in</a>
    </div>
  </main>
</div>

<script type="module" src="/js/forgot-password.js"></script>
</body>
</html>
