<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — V-ACCESS</title>
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="auth-shell">
  <main class="auth-card">
    <span class="auth-card__mark">V·ACCESS</span>
    <h1>Log in</h1>
    <p class="text-muted">Use your VIT student email to continue.</p>

    <div id="alert-region" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field" id="field-email">
        <label for="email">VIT email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="yourname2026@vitstudent.ac.in" required />
        <div class="field-error" hidden></div>
      </div>
      <div class="field" id="field-password">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <div class="field-error" hidden></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        <span class="btn-label">Log in</span>
      </button>
    </form>

    <div class="auth-card__foot">
      <a href="/forgot-password.html">Forgot password?</a> &middot;
      New to V-ACCESS? <a href="/register.html">Create an account</a>
    </div>
  </main>
</div>

<script type="module" src="/js/login.js"></script>
</body>
</html>
