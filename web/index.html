<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — V-ACCESS Academic Portal</title>
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-brand-crest">
    <span class="auth-brand-crest__logo">V·A</span>
    <span class="auth-brand-crest__title">V-ACCESS</span>
  </div>

  <main class="auth-card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-3)">
      <span class="chip chip-venue">Student & Faculty Portal</span>
      <span class="chip chip-live"><span class="pulse-dot"></span> Online</span>
    </div>

    <h1>Sign in</h1>
    <p class="text-muted">Use your institutional <strong style="color:var(--color-ink)">@vitstudent.ac.in</strong> email to continue.</p>

    <div id="alert-region" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field" id="field-email">
        <label for="email">Institutional email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="first.last2026@vitstudent.ac.in" required />
        <div class="field-error" hidden></div>
      </div>
      <div class="field" id="field-password">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--sp-2)">
          <label for="password" style="margin-bottom:0">Password</label>
          <a href="/forgot-password.html" style="font-size:var(--text-xs); color:var(--color-accent)">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
        <div class="field-error" hidden></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn" style="margin-top:var(--sp-2)">
        <span class="btn-label">Access Portal</span>
      </button>
    </form>

    <div class="auth-card__foot">
      New to V-ACCESS? <a href="/register.html" style="font-weight:600">Register with VIT email</a>
    </div>
  </main>

  <footer style="margin-top:var(--sp-5); font-size:var(--text-xs); color:var(--color-ink-muted); text-align:center;">
    Vellore Institute of Technology &middot; Unified Academic &amp; Schedule Portal
  </footer>
</div>

<script type="module" src="/js/login.js"></script>
</body>
</html>
