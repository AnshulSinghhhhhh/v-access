<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — V-ACCESS</title>
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="auth-shell">
  <main class="auth-card">
    <span class="auth-card__mark">V·ACCESS</span>
    <h1>Create your account</h1>
    <p class="text-muted">Registration is open to VIT students with a valid institute email.</p>

    <div id="alert-region" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="field" id="field-fullName">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" required />
        <div class="field-error" hidden></div>
      </div>
      <div class="field" id="field-email">
        <label for="email">VIT email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="yourname2026@vitstudent.ac.in" required />
        <div class="hint">Must end in @vitstudent.ac.in</div>
        <div class="field-error" hidden></div>
      </div>
      <div class="field" id="field-password">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required />
        <div class="hint">At least 8 characters, with a letter and a number.</div>
        <div class="field-error" hidden></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        <span class="btn-label">Create account</span>
      </button>
    </form>

    <div class="auth-card__foot">
      Already have an account? <a href="/index.html">Log in</a>
    </div>
  </main>
</div>

<script type="module" src="/js/register.js"></script>
</body>
</html>
