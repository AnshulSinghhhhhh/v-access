      Dashboard

    <a class="app-nav__link" href="/timetable.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>

    <a class="app-nav__link" href="/faculty.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Faculty Review
    </a>
    <a class="app-nav__link" href="/find-my-class.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      Find My Class
    </a>
    <a class="app-nav__link" href="/social.html" aria-current="page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

      Log out
    </button>
  </nav>

  <main class="app-main" id="main" style="max-width: 680px">
    <div class="app-main__header">
      <div>
        <h1>Social Page</h1>
        <p class="text-muted mt-0">Announcements, events, and updates from students.</p>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab-btn" id="tab-feed" role="tab" aria-selected="true" aria-controls="panel-feed">Feed</button>
      <button class="tab-btn" id="tab-moderation" role="tab" aria-selected="false" aria-controls="panel-moderation" hidden>Reported posts</button>
    </div>

    <section id="panel-feed" role="tabpanel" aria-labelledby="tab-feed">
      <div id="feed-alert-region" role="alert"></div>

      <div class="composer">
        <div class="composer__row">
          <div class="avatar" id="composer-avatar">?</div>
          <textarea id="composer-text" maxlength="3000" placeholder="Share an announcement, event, or update&hellip;"></textarea>
        </div>
        <div id="composer-media-preview" class="composer__media-preview" hidden>
          <img id="composer-image-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Attached image preview" hidden />
          <video id="composer-video-preview" muted playsinline hidden></video>
          <button type="button" id="composer-media-remove" aria-label="Remove attachment">&times;</button>
        </div>
        <div class="composer__footer">
          <div class="composer__attach-row">
            <label class="attach-btn">
              <input type="file" id="composer-file-input" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" />
              🖼️ Photo
            </label>
            <label class="attach-btn">
              <input type="file" id="composer-video-input" accept="video/mp4,video/webm,video/ogg" style="display:none" />
              🎬 Video
            </label>
          </div>
          <button class="btn btn-primary btn-sm" id="composer-submit">Post</button>
        </div>
      </div>

      <div id="feed-loading" class="loading-row"><span class="spinner" aria-hidden="true"></span> Loading feed&hellip;</div>
      <div id="feed-list"></div>
      <div class="load-more-row" id="load-more-row" hidden>
        <button class="btn btn-secondary btn-sm" id="load-more-btn">Load more</button>
      </div>
    </section>

    <section id="panel-moderation" role="tabpanel" aria-labelledby="tab-moderation" hidden>
      <div id="moderation-alert-region" role="alert"></div>
      <div id="moderation-loading" class="loading-row" hidden><span class="spinner" aria-hidden="true"></span> Loading&hellip;</div>
      <div id="moderation-list"></div>
    </section>
  </main>
</div>

<dialog class="confirm-dialog" id="report-dialog">
  <h2>Report this post</h2>
  <div class="field">
    <label for="report-reason-input">Reason</label>
    <textarea id="report-reason-input" rows="3" maxlength="300" placeholder="What's wrong with this post?" style="width:100%;padding:var(--sp-3);border:1px solid var(--color-line);border-radius:var(--radius-md);font-family:var(--font-ui)"></textarea>
  </div>
  <div class="confirm-dialog__actions">
    <button class="btn btn-secondary" id="report-dialog-cancel">Cancel</button>
    <button class="btn btn-primary" id="report-dialog-confirm">Submit report</button>
  </div>
</dialog>

<script type="module" src="/js/social.js"></script>
</body>
</html>
