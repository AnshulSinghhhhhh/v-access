<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify your email — V-ACCESS</title>
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="auth-shell">
  <main class="auth-card">
    <div class="auth-card__brand">
      <div class="auth-card__crest" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 2L4 7V15C4 22.5 9.1 29.5 16 31C22.9 29.5 28 22.5 28 15V7L16 2Z" fill="#1E3A8A" fill-opacity="0.12" stroke="#1E3A8A" stroke-width="2" stroke-linejoin="round"/>
          <path d="M11 12L16 22L21 12" stroke="#1E3A8A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="9" r="1.5" fill="#B45309"/>
        </svg>
      </div>
      <div class="auth-card__institution">
        <span class="auth-card__portal-name">V·ACCESS</span>
        <span class="auth-card__portal-sub">Vellore Institute of Technology</span>
      </div>
    </div>
    <h1>Verify your email</h1>
    <p class="text-muted">Enter the 6-digit code we sent to <strong id="email-display"></strong>.</p>

    <div id="alert-region" role="alert"></div>

    <form id="verify-form" novalidate>
      <div class="field otp-input" id="field-otp">
        <label for="otp">Verification code</label>
        <input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
        <div class="field-error" hidden></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        <span class="btn-label">Verify</span>
      </button>
    </form>

    <div class="auth-card__foot">
      Didn't get a code?
      <button type="button" id="resend-btn" class="btn btn-secondary btn-sm" style="margin-top: var(--sp-2)">Resend code</button>
    </div>
  </main>
</div>

<script type="module" src="/js/verify.js"></script>
</body>
</html>
