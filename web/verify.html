<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify your email — V-ACCESS</title>
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="auth-shell">
  <main class="auth-card">
    <span class="auth-card__mark">V·ACCESS</span>
    <h1>Verify your email</h1>
    <p class="text-muted">Enter the 6-digit code we sent to <strong id="email-display"></strong>.</p>

    <div id="alert-region" role="alert"></div>

    <form id="verify-form" novalidate>
      <div class="field otp-input" id="field-otp">
        <label for="otp">Verification code</label>
        <input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
        <div class="field-error" hidden></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        <span class="btn-label">Verify</span>
      </button>
    </form>

    <div class="auth-card__foot">
      Didn't get a code?
      <button type="button" id="resend-btn" class="btn btn-secondary btn-sm" style="margin-top: var(--sp-2)">Resend code</button>
    </div>
  </main>
</div>

<script type="module" src="/js/verify.js"></script>
</body>
</html>
